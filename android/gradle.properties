org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
# Build box: the sandbox cgroup caps memory at 4 GB — Xmx1536m + 2 workers
# OOM-killed the gradle JVM mid-compile. One worker, smaller heap.
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.builder.sdkDownload=false
org.gradle.daemon=false

# Build box: kotlin incremental classpath snapshots blow the disk budget
# (every dependency jar gets a multi-GB snapshot transform). Non-incremental
# is slower per-change but fits this sandbox.
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.classpath.snapshot=false
