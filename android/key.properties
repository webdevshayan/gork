# Pinned release signing — committed to the repo ON PURPOSE.
#
# Why: release builds used the debug keystore (~/.android/debug.keystore),
# which Android Studio/gradle REGENERATES whenever it is missing — and this
# build sandbox is recycled between sessions. Every regeneration produced a
# different signing key, so every new APK collided with the installed one
# ("package has conflicts" / INSTALL_FAILED_UPDATE_INCOMPATIBLE) and the
# user had to uninstall first. A keystore that lives HERE survives recycles,
# so every future build signs identically and updates install in place.
#
# One-time migration: uninstall the currently installed gork once, install
# v1.20.0 — from then on every update installs cleanly over the last.
storeFile=gork-release.keystore
storePassword=gork-release-2026
keyAlias=gork
keyPassword=gork-release-2026
